# ---- Preprod (Janus) Environment Configuration ----
# https://pp-janus.furlenco.com — a stable pre-production build, publicly reachable (no VPN
# required). Preferred over `staging` for automation while staging is mid-rollout and serving
# inconsistent header/homepage layouts across page loads.

web.base.url=https://pp-janus.furlenco.com
furlenco.base.url=https://pp-janus.furlenco.com
browser=chromium
headless=true
default.timeout.ms=30000
slowmo.ms=0

api.base.url=https://staging-api.example.com/api

# Staging/QA accept ANY phone number with the default OTP, so tests log in with a fresh random
# number each time (see FurlencoLoginPage#loginAsFreshUser). Non-sensitive values only.
test.user.otp=1234
# Fixed account ONLY for tests that need pre-existing orders / saved addresses.
test.user.history.username=8088253943
# Legacy keys (kept for compatibility): username = history account, password = OTP fallback.
test.user.username=8088253943
test.user.password=1234

db.host=
db.port=5432
db.name=
db.user=
db.password=
db.pool.size=5

api.token=

# Furlenco runs a live A/B experiment framework (see the `_experiments` cookie) — the same URL can
# render a completely different header/homepage layout per visit depending on random variant
# assignment (verified 2026-09-16: experiment_new_desktop=A renders a redesigned header with no
# "Account menu" control at all, while =B renders the classic header this framework's Furlenco page
# objects are built against). FurlencoExperiments.pinClassicDesktopLayout() (called from
# FurlencoHomePage.open()) pins this cookie before every navigation when the flag below is enabled,
# so runs are deterministic instead of randomly flipping between layouts.
furlenco.pin.experiments=true
furlenco.experiment.new.desktop.variant=B

# Razorpay test-mode cards — Razorpay's own officially published test cards
# (https://razorpay.com/docs/payments/payments/test-card-upi-details/), NEVER real cards. Used
# only against Razorpay's test-mode integration on preprod, which never moves real money. CVV and
# expiry are arbitrary per Razorpay's own docs ("use a random CVV and any future date") — the
# fixed values below are just a convenient, valid-shaped default.
test.payment.card.name=Test User
test.payment.card.validity=12/35
test.payment.card.cvv=123

# Default card for successful-payment tests — Visa Debit (Consumer), Indian payments test set.
test.payment.card.number=4100280000001007

# Named alternates for tests exercising specific networks/card types (Indian payments test set).
test.payment.card.visa.debit.number=4100280000001007
test.payment.card.mastercard.credit.business.number=5555510000081006
test.payment.card.mastercard.prepaid.consumer.number=5180287200091001
test.payment.card.rupay.credit.number=6527658900001005
test.payment.card.diners.credit.number=36082800091007
test.payment.card.amex.credit.number=340256000401007

# Subscriptions test cards.
test.payment.card.subscription.domestic.visa.number=4718609108204366
test.payment.card.subscription.intl.mastercard.credit.number=5104015555555558
test.payment.card.subscription.intl.mastercard.debit.number=5104060000000008

# EMI test card.
test.payment.card.emi.mastercard.number=5241810000000000

business.furlenco.base.url=https://business.furlenco.com

# A pincode with broader product availability than the default (verified live: several products
# under the default pincode had a consistently disabled Add to Cart, most likely a
# delivery-serviceability/inventory gap for that pincode) — used by tests that need to actually
# add a product to cart.
test.delivery.pincode=110001

# An email already registered on preprod (from a live "Oops! ... already registered" screenshot
# shared during test design) — used to verify the new-user signup flow's duplicate-email branch.
test.new.user.registered.email=test@gmail.com

# Native mobile app (Appium) — PLACEHOLDERS, see qa.properties / AppiumManager javadoc.
appium.server.url=http://127.0.0.1:4723
appium.platform=android
appium.device.name=
appium.platform.version=
appium.app.path=
appium.app.package=
appium.app.activity=
appium.bundle.id=
appium.no.reset=true
appium.command.timeout.seconds=60

retry.max.count=2
thread.count=4

# AI Foundation Layer (Disabled by default)
ai.enabled=false
ai.provider=gemini
ai.model=
ai.failure.analysis.enabled=false
ai.timeout.seconds=20

# Phase 6: AI Locator Advisor runtime (live Playwright Page) validation (Disabled by default)
ai.locator.runtime.validation.enabled=false
ai.locator.runtime.allowed.environments=qa,staging,preprod
