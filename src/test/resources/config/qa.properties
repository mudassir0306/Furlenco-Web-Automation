# ---- QA Environment Configuration ----

# Web
web.base.url=https://www.saucedemo.com
furlenco.base.url=https://stag.furlenco.com
browser=chromium
headless=false
default.timeout.ms=30000
slowmo.ms=0

# API
api.base.url=https://reqres.in/api

# Test users (non-sensitive demo creds only — never put real secrets here)
test.user.username=8088253943
test.user.password=1234

# DB (local dev fallback only — CI must inject via env vars: DB_HOST, DB_PORT, DB_NAME, DB_USER, DB_PASSWORD)
db.host=localhost
db.port=5432
db.name=qa_db
db.user=qa_user
db.password=changeit
db.pool.size=5

# API auth (fallback only — CI must inject API_TOKEN via env var / secret)
api.token=

# Native mobile app (Appium) — PLACEHOLDERS. Fill in before running any test under
# com.tests.mobile: requires a running Appium server + a real device/emulator with the Furlenco
# app installed, or an .apk/.ipa path. See AppiumManager javadoc for the full key list.
appium.server.url=http://127.0.0.1:4723
appium.platform=android
appium.device.name=
appium.platform.version=
appium.app.path=
appium.app.package=
appium.app.activity=
appium.bundle.id=
appium.no.reset=true
appium.command.timeout.seconds=60

# Retry
retry.max.count=2

# Parallel execution
thread.count=4

# AI Foundation Layer (Disabled by default)
ai.enabled=false
ai.provider=gemini
ai.model=
ai.failure.analysis.enabled=false
ai.timeout.seconds=20

# Phase 6: AI Locator Advisor runtime (live Playwright Page) validation (Disabled by default)
ai.locator.runtime.validation.enabled=false
ai.locator.runtime.allowed.environments=qa,staging

# Pin Furlenco A/B experiments so runs get a stable layout (FurlencoExperiments).
# CheckoutRevamp=VariantB serves the new "Your Cart" page that FurlencoCartPage is written for;
# VariantA serves the older "Rent Cart" page (verified on stag 2026-10-07).
furlenco.pin.experiments=true
furlenco.experiment.checkout.revamp.variant=VariantB
