name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      groups:
        description: "TestNG groups to run. Empty = public (sample web + API tests on public sites). The furlenco groups need the staging VPN, so use a self-hosted runner for them."
        required: false
        default: ""
      runner:
        description: "Runner label, e.g. a self-hosted runner on the VPN for stag.furlenco.com"
        required: false
        default: "ubuntu-latest"
      browser:
        description: "chromium, firefox or webkit"
        required: false
        default: "chromium"

jobs:
  test:
    runs-on: ${{ inputs.runner || 'ubuntu-latest' }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
          cache: maven

      - name: Run tests
        run: mvn -B test -Dheadless=true -Dbrowser=${{ inputs.browser || 'chromium' }} -Dgroups="${{ inputs.groups || 'public' }}"

      - name: Upload Allure results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results
          path: target/allure-results

      - name: Upload failure artifacts (screenshots, traces)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: failure-artifacts
          path: target/traces/
