name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      groups:
        description: "TestNG groups to run. Empty = furlenco (all Furlenco tests). They hit stag.furlenco.com, which needs the staging VPN, so run them on a self-hosted runner on the VPN (set the runner input)."
        required: false
        default: ""
      runner:
        description: "Runner label, e.g. a self-hosted runner on the VPN for stag.furlenco.com"
        required: false
        default: "ubuntu-latest"
      browser:
        description: "chromium, firefox or webkit"
        required: false
        default: "chromium"

jobs:
  test:
    runs-on: ${{ inputs.runner || 'ubuntu-latest' }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
          cache: maven

      - name: Check generated docs are current
        run: |
          java src/test/java/com/tools/TraceabilityGenerator.java --check || { echo "::error::docs/test-case-traceability.md is stale. Run 'java src/test/java/com/tools/TraceabilityGenerator.java' and commit."; exit 1; }
          java src/test/java/com/tools/ProjectDocsGenerator.java --check || { echo "::error::README.md / docs/PROJECT_MASTER_PROMPT.md AUTO blocks are stale. Run 'java src/test/java/com/tools/ProjectDocsGenerator.java' and commit."; exit 1; }

      - name: Run tests
        run: mvn -B test -Dheadless=true -Dbrowser=${{ inputs.browser || 'chromium' }} -Dgroups="${{ inputs.groups || 'furlenco' }}"

      - name: Upload Allure results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results
          path: target/allure-results

      - name: Upload failure artifacts (screenshots, traces)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: failure-artifacts
          path: target/traces/
